<!-- Меню паузы -->
<div id="pause-menu" style="display: none;">
  <div class="pause-content">
    <h2>ПАУЗА</h2>
    <div class="pause-stats">
      <p><span class="stat-label">🎭 Уровень:</span> <span class="stat-value" id="pause-level">1</span></p>
      <p class="stat-hp"><span class="stat-label">❤️ HP:</span> <span class="stat-value"><span id="pause-hp">100</span><span class="hp-separator">/</span><span id="pause-maxhp">100</span></span></p>
      <p class="stat-gold"><span class="stat-label">💰 Золото:</span> <span class="stat-value" id="pause-gold">0</span></p>
      <p><span class="stat-label">⚔️ Урон:</span> <span class="stat-value" id="pause-damage">20</span></p>
      <p><span class="stat-label">⏱️ Время:</span> <span class="stat-value" id="pause-time">00:00</span></p>
    </div>
    <div class="pause-buttons">
      <button id="pause-resume-btn">▶️ Продолжить</button>
      <button id="pause-save-btn">💾 Сохранить игру</button>
      <button id="pause-achievements-btn">🏆 Достижения</button>
      <button id="pause-exit-btn">🚪 Выйти в главное меню</button>
    </div>
  </div>
</div>
