<!-- Окно чтения записки -->
<div id="note-reader" style="display: none;">
  <div class="note-reader-content">
    <div class="note-reader-header">
      <h2 id="note-reader-title">Записка</h2>
      <button id="note-reader-close" class="note-reader-close">✕</button>
    </div>
    <div class="note-reader-body">
      <p id="note-reader-text">Текст записки...</p>
    </div>
    <div class="note-reader-footer">
      <span>Найдено: <span id="note-reader-count">0/12</span></span>
    </div>
  </div>
</div>
