<!-- Параметры игрока во время игры -->
<div id="ui">
  <!-- HP: иконка + полоска + текст -->
  <div id="ui-hp">
    <span id="hp-icon">❤️</span>
    <div id="hp-bar-bg">
      <div id="hp-bar-fill" style="width:100%"></div>
    </div>
    <span id="hp-text"><span id="hp-val">100</span>/<span id="max-hp-val">100</span></span>
  </div>

  <!-- 1-я строка: Уровень + Монстры -->
  <div id="ui-row-1">
    <span>🎭 Уровень: <span id="lvl-val">1</span></span>
    <span>👾 Монстров: <span id="monsters-val">0</span></span>
  </div>

  <!-- 2-я строка: Золото + Урон -->
  <div id="ui-row-2">
    <span>💰 Золото: <span id="gold-val">0</span></span>
    <span>⚔️ Урон: <span id="dmg-val">20</span></span>
  </div>

  <!-- Оружие: ближнее и дальнее -->
  <div id="ui-weapons">
    <div id="weapon-melee">
      <img id="weapon-melee-img" src="" alt="Оружие">
      <span id="weapon-melee-label">Обычный посох</span>
    </div>
    <div id="weapon-ranged">
      <img id="weapon-ranged-img" src="" alt="Дальнее">
      <span id="weapon-ranged-label">Огненный шар</span>
    </div>
  </div>
</div>
