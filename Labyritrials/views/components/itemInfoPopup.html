<div id="itemInfo-popup" style="display: none;">
  <div class="itemInfo-popup-overlay">
    <div class="itemInfo-popup-content">
      <!-- Уголки -->
      <div class="itemInfo-popup-corner-tl"></div>
      <div class="itemInfo-popup-corner-br"></div>
      
      <div class="itemInfo-popup-header">
        <h2 id="itemInfo-popup-title">Название предмета</h2>
      </div>
      
      <div class="itemInfo-popup-body">
        <div class="itemInfo-popup-icon" id="itemInfo-popup-icon">
          <img src="" alt="Предмет" id="itemInfo-popup-image">
        </div>
        <div class="itemInfo-popup-description" id="itemInfo-popup-description">
          Описание предмета...
        </div>
      </div>
      
      <div class="itemInfo-popup-footer">
        <button id="itemInfo-popup-take" class="itemInfo-popup-btn itemInfo-popup-btn-take">Взять</button>
        <button id="itemInfo-popup-leave" class="itemInfo-popup-btn itemInfo-popup-btn-leave">Оставить</button>
      </div>
    </div>
  </div>
</div>
