<!-- Окно настроек -->
<div id="settings-ui" style="display: none;">
  <div class="settings-content">
    <div class="settings-header">
      <h2>⚙️ НАСТРОЙКИ</h2>
      <button id="settings-close-btn" class="settings-close-btn">✕</button>
    </div>

    <!-- Вкладки -->
    <div class="settings-tabs-wrapper">
      <div class="settings-tabs">
        <button class="settings-tab active" data-tab="audio">🔊 АУДИО</button>
        <button class="settings-tab" data-tab="graphics">🖥️ ГРАФИКА</button>
        <button class="settings-tab" data-tab="controls">🎮 УПРАВЛЕНИЕ</button>
        <button class="settings-tab" data-tab="save">💾 СОХРАНЕНИЕ</button>
      </div>
    </div>

    <!-- Содержимое вкладок -->
    <div class="settings-body">

      <!-- ===== ВКЛАДКА: АУДИО ===== -->
      <div class="settings-tab-content active" id="settings-tab-audio">
        <div class="settings-section">
          <div class="settings-row">
            <label class="settings-label">
              <span>Громкость музыки</span>
              <input type="range" id="settings-music-volume" min="0" max="100" value="40" class="settings-slider">
              <span class="settings-value" id="settings-music-value">40%</span>
            </label>
          </div>
          <div class="settings-row">
            <label class="settings-label">
              <span>Громкость звуков</span>
              <input type="range" id="settings-sound-volume" min="0" max="100" value="30" class="settings-slider">
              <span class="settings-value" id="settings-sound-value">30%</span>
            </label>
          </div>
          <div class="settings-row">
            <label class="settings-label settings-toggle">
              <span>🎵 Фоновая музыка</span>
              <input type="checkbox" id="settings-music-toggle" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="settings-row">
            <label class="settings-label settings-toggle">
              <span>🔊 Звуковые эффекты</span>
              <input type="checkbox" id="settings-sound-toggle" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- ===== ВКЛАДКА: ГРАФИКА ===== -->
      <div class="settings-tab-content" id="settings-tab-graphics">
        <div class="settings-section">
          <div class="settings-row">
            <label class="settings-label settings-toggle">
              <span>📊 Показывать FPS</span>
              <input type="checkbox" id="settings-show-fps">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="settings-row">
            <label class="settings-label">
              <span>🎮 Ограничение FPS</span>
              <select id="settings-fps-limit" class="settings-select">
                <option value="0">Без ограничений</option>
                <option value="30">30 FPS</option>
                <option value="60" selected>60 FPS</option>
                <option value="120">120 FPS</option>
                <option value="144">144 FPS</option>
              </select>
            </label>
          </div>
          <div class="settings-row">
            <label class="settings-label settings-toggle">
              <span>🔄 Вертикальная синхронизация (VSync)</span>
              <input type="checkbox" id="settings-vsync-toggle" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="settings-row">
            <label class="settings-label settings-toggle">
              <span>🖼️ Сглаживание изображений</span>
              <input type="checkbox" id="settings-smoothing-toggle">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- ===== ВКЛАДКА: УПРАВЛЕНИЕ ===== -->
      <div class="settings-tab-content" id="settings-tab-controls">
        <div class="settings-section">          
          <div class="settings-controls-grid">
            <!-- Движение -->
            <div class="control-row">
              <div class="control-keys">
                <span class="key">W</span>
                <span class="key">A</span>
                <span class="key">S</span>
                <span class="key">D</span>
              </div>
              <span class="control-action">Движение (вверх, влево, вниз, вправо)</span>
            </div>
            
            <div class="control-row">
              <div class="control-keys">
                <span class="key">&#9650;</span>
                <span class="key">&#9668;</span>
                <span class="key">&#9660;</span>
                <span class="key">&#9658;</span>
              </div>
              <span class="control-action">Движение (стрелки)</span>
            </div>
            
            <!-- Атака -->
            <div class="control-row">
              <div class="control-keys">
                <span class="key">ЛКМ</span>
              </div>
              <span class="control-action">Ближняя атака (зажать для усиленного удара)</span>
            </div>
            
            <div class="control-row">
              <div class="control-keys">
                <span class="key">Q</span>
              </div>
              <span class="control-action">Дальняя атака</span>
            </div>
            
            <!-- Взаимодействие -->
            <div class="control-row">
              <div class="control-keys">
                <span class="key">E</span>
              </div>
              <span class="control-action">Взаимодействие с предметами и объектами</span>
            </div>
            
            <!-- Инвентарь -->
            <div class="control-row">
              <div class="control-keys">
                <span class="key">I</span>
              </div>
              <span class="control-action">Открыть / закрыть инвентарь</span>
            </div>
            
            <!-- Пауза -->
            <div class="control-row">
              <div class="control-keys">
                <span class="key">ESC</span>
              </div>
              <span class="control-action">Меню паузы</span>
            </div>
          </div>
          
          <div class="settings-controls-footer">
            <span class="controls-hint">💡 При приближении к объектам могут появляться подсказки</span>
          </div>
        </div>
      </div>

      <!-- ===== ВКЛАДКА: СОХРАНЕНИЕ ===== -->
      <div class="settings-tab-content" id="settings-tab-save">
        <div class="settings-section">
          <div class="settings-row settings-row-buttons">
            <button id="settings-export-save" class="settings-btn-secondary" style="flex: 1;">💾 Экспорт</button>
            <button id="settings-import-save" class="settings-btn-secondary" style="flex: 1;">📂 Импорт</button>
            <input type="file" id="settings-import-file" accept=".json" style="display: none;">
          </div>
          <div class="settings-row">
            <button id="settings-reset-progress" class="settings-btn-danger" style="width: 100%;">🗑️ Очистить все данные</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
