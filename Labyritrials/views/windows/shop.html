<!-- Интерфейс лавки торговца -->
<div id="shop-ui">
  <div class="shop-overlay">
    <div class="shop-content">
      
      <div class="shop-header">
        <div class="shop-header-top">
          <div class="shopkeeper">
            <div class="shopkeeper-info">
              <div class="shopkeeper-name">Торговец</div>
              <div class="shopkeeper-speech" id="shopkeeper-speech">
                «Заходи, путник! Есть чем поживиться...»
              </div>
            </div>
          </div>
          <button id="shop-close-btn" class="shop-close-btn">✕</button>
        </div>
        
        <div class="shop-gold-display">
          <span class="shop-gold-label">У вас</span>
          <span class="shop-gold-amount" id="shop-gold">0</span>
          <span class="shop-gold-icon">💰</span>
        </div>
      </div>
      
      <!-- Вкладки -->
      <div class="shop-tabs">
        <button class="shop-tab active" data-tab="upgrades">📈 Улучшения</button>
        <button class="shop-tab" data-tab="weapons">⚔️ Оружие</button>
        <button class="shop-tab" data-tab="items">🎒 Предметы</button>
      </div>
      
      <!-- Содержимое вкладок -->
      <div class="shop-body">
        
        <!-- Вкладка: Улучшения -->
        <div class="shop-tab-content active" id="shop-tab-upgrades">
          <div class="shop-section">
            <div class="shop-grid">
              <!-- HP -->
              <button id="buy-hp" class="shop-item upgrade">
                <span class="shop-icon">❤️</span>
                <div class="shop-info">
                  <span class="shop-name">Увеличение здоровья</span>
                  <span class="shop-desc">+25 к максимуму HP</span>
                </div>
                <div class="shop-right">
                  <span class="shop-price"><span id="hp-cost">30</span></span>
                  <span class="shop-status" id="hp-status">Купить</span>
                </div>
              </button>
              
              <!-- Урон -->
              <button id="buy-dmg" class="shop-item upgrade">
                <span class="shop-icon">⚔️</span>
                <div class="shop-info">
                  <span class="shop-name">Увеличение урона</span>
                  <span class="shop-desc">+10 к базовому урону</span>
                </div>
                <div class="shop-right">
                  <span class="shop-price"><span id="dmg-cost">40</span></span>
                  <span class="shop-status" id="dmg-status">Купить</span>
                </div>
              </button>
            </div>
          </div>
        </div>
        
        <!-- Вкладка: Оружие -->
        <div class="shop-tab-content" id="shop-tab-weapons">
          <div class="shop-section">
            <div class="shop-grid">
              <!-- Громовой посох -->
              <button id="buy-sword-stun" class="shop-item weapon">
                <span class="shop-icon">⚡</span>
                <div class="shop-info">
                  <span class="shop-name">Громовой посох</span>
                  <span class="shop-desc">Оглушает врага на 2 секунды</span>
                </div>
                <div class="shop-right">
                  <span class="shop-price" id="stun-price">90</span>
                  <span class="shop-status" id="stun-status">Купить</span>
                </div>
              </button>
              
              <!-- Посох Вампира -->
              <button id="buy-sword-vamp" class="shop-item weapon">
                <span class="shop-icon">🦇</span>
                <div class="shop-info">
                  <span class="shop-name">Посох Вампира</span>
                  <span class="shop-desc">Восстанавливает HP при атаке</span>
                </div>
                <div class="shop-right">
                  <span class="shop-price" id="vamp-price">400</span>
                  <span class="shop-status" id="vamp-status">Купить</span>
                </div>
              </button>
            </div>
          </div>
          
          <div class="shop-section">
            <div class="shop-grid">
              <!-- Огненный шар -->
              <button id="buy-fireball" class="shop-item weapon">
                <span class="shop-icon">🔥</span>
                <div class="shop-info">
                  <span class="shop-name">Огненный шар</span>
                  <span class="shop-desc">Запускает шар, прожигающий врагов</span>
                </div>
                <div class="shop-right">
                  <span class="shop-price" id="fireball-price">200</span>
                  <span class="shop-status" id="fireball-status">Купить</span>
                </div>
              </button>
            </div>
          </div>
        </div>
        
        <!-- Вкладка: Предметы -->
        <div class="shop-tab-content" id="shop-tab-items">
          <div class="shop-section">
            <div class="shop-grid">
              <!-- Карта -->
              <button id="buy-map" class="shop-item item">
                <span class="shop-icon">🗺️</span>
                <div class="shop-info">
                  <span class="shop-name">Карта лабиринта</span>
                  <span class="shop-desc">Открывает мини-карту</span>
                </div>
                <div class="shop-right">
                  <span class="shop-price" id="map-price">50</span>
                  <span class="shop-status" id="map-status">Купить</span>
                </div>
              </button>
            </div>
          </div>
          
          <div class="shop-section">
            <div class="shop-grid">
              <!-- Огненный талисман -->
              <button id="buy-talisman-fire" class="shop-item equipment">
                <span class="shop-icon">🔥</span>
                <div class="shop-info">
                  <span class="shop-name">
                    Огненный талисман
                    <span class="new-badge">Новинка</span>
                  </span>
                  <span class="shop-desc">Защищает от холода</span>
                </div>
                <div class="shop-right">
                  <span class="shop-price" id="talisman-fire-price">150</span>
                  <span class="shop-status" id="talisman-fire-status">Купить</span>
                </div>
              </button>
            </div>
          </div>
        </div>
        
      </div>
      
    </div>
  </div>
</div>
