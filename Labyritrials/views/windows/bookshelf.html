<!-- Окно библиотеки (полки с книгами) -->
<div id="bookshelf-ui" style="display: none;">
  <div class="bookshelf-content">
    <div class="bookshelf-header">
      <h2>📚 БИБЛИОТЕКА</h2>
      <button id="bookshelf-close-btn" class="bookshelf-close-btn">✕</button>
    </div>
    
    <div class="bookshelf-stats">
      <span>Найдено записок: <span id="bookshelf-found-count">0</span> / <span id="bookshelf-total-count">12</span></span>
    </div>
    
    <div id="bookshelf-list" class="bookshelf-list">
      <!-- Список записок рендерится через JS -->
    </div>
    
    <div class="bookshelf-footer">
      <span class="bookshelf-hint">📖 Кликните по названию, чтобы перечитать записку</span>
    </div>
  </div>
</div>
